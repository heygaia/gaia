name: Upload verdict
description: >
  Hand this lane's verdict to the quality gate, which consolidates every lane's
  into one table and fails on any lane that did not report. Add it as the LAST
  step of every job the gate needs, with `if: always()` — a lane that failed is
  exactly the one whose verdict is worth reading.

  A lane that has adopted the contract (scripts/ci/verdict.py) has already
  written its own verdict, with findings at file:line; this action leaves that
  alone (`--only-if-missing`) and just uploads it. A lane that has not gets a
  bare one derived from the job status, so that adopting a lane is a strict
  improvement to what the gate prints rather than a prerequisite for the gate
  working at all. What the gate will NOT tolerate is silence: a job with no
  upload step reaches it as NO VERDICT and fails it.
inputs:
  name:
    description: >
      Artifact suffix, uploaded as `verdict-<name>`. Must be unique across the
      run, so a matrix job folds its matrix value in — the CALLER does that,
      passing `name: test-python-<matrix value>`, because a composite has no
      matrix context of its own.

      Written without expression syntax on purpose: an expression inside a
      `description` is template-parsed exactly like one in a step, and a usage
      example here failed EVERY job that used this action with
      "Unrecognized named-value: 'matrix'".
    required: true
  lane:
    description: >
      Lane id in the contract. Defaults to the artifact name. Also caller-filled
      for the same reason — `mutation/shard-<n>`, `test-python/<slice>`.
    required: false
    default: ""
  path:
    description: Directory the lane's verdicts were written to.
    required: false
    default: verify-logs/verdicts
runs:
  using: composite
  steps:
    # A job that exceeds its `timeout-minutes` is CANCELLED by GitHub, and an
    # always()-guarded step still gets to run — which is the one moment we can
    # say "this lane died at its cap" instead of leaving the gate to print
    # `failure` for something that never got as far as failing. The two need
    # opposite reactions: a failure has a finding to read, a timeout has a diff
    # to split or a cap to raise.
    - name: Record a timeout verdict
      if: cancelled()
      shell: bash
      run: >
        python3 "$GITHUB_WORKSPACE/scripts/ci/verdict.py" emit --only-if-missing
        --lane "${{ inputs.lane || inputs.name }}" --status timed_out --out "${{ inputs.path }}"
        --summary "cancelled before it reported — it hit its timeout-minutes cap, or the run was superseded"
        --advice "Split the diff or raise this job's timeout-minutes. There is no finding to read: the lane never reached the end."
    - name: Record a failure verdict
      if: failure()
      shell: bash
      run: >
        python3 "$GITHUB_WORKSPACE/scripts/ci/verdict.py" emit --only-if-missing
        --lane "${{ inputs.lane || inputs.name }}" --status fail --out "${{ inputs.path }}"
        --summary "the lane failed and has not adopted the verdict contract — its reason is only in this job's log"
        --advice "Open this job's log. Then give the lane a `ci_verdict_die` so the next reader does not have to."
    - name: Record a pass verdict
      if: success()
      shell: bash
      run: >
        python3 "$GITHUB_WORKSPACE/scripts/ci/verdict.py" emit --only-if-missing
        --lane "${{ inputs.lane || inputs.name }}" --status pass --out "${{ inputs.path }}"
        --summary "passed"
    - name: Upload the verdict
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: verdict-${{ inputs.name }}
        path: ${{ inputs.path }}/**
        # Not `error`: a lane that wrote nothing must reach the gate as NO
        # VERDICT there, with the whole table for context — not as a red X on
        # an upload step nobody scrolls to.
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 7
